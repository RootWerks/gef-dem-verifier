name: GEF-DEM Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Test Golden Vectors
        run: |
          cat vectors/golden.json | jq -c '.[]' | while read -r row; do
            echo "--- Vector: $row"
            echo "$row" | python3 harness/eval.py || true
          done
